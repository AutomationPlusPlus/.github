name: Bug report
description: Something is broken or does not work as documented.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Please do not report security problems here; follow SECURITY.md instead.

        **Never paste real API keys, tokens, passwords, organization IDs, serial numbers, or customer data.** Replace them with placeholder values.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the problem. Include any error message.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run ...
        2. Open ...
        3. See error
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The output of the product's `version` command (version, commit, and edition).
    validations:
      required: true
  - type: dropdown
    id: edition
    attributes:
      label: Edition
      options:
        - Community
        - Pro
        - Not sure
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Operating system and how you installed it (Docker, Linux package, Windows installer, from source).
    validations:
      required: true
  - type: textarea
    id: support-bundle
    attributes:
      label: Support bundle
      description: |
        For operational problems (backups, restores, scheduling, startup), create a support bundle with the product's support bundle command and drag the .zip file here. The bundle redacts secrets, but please check it before you upload it.
  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      description: Paste relevant log lines with secrets and identifiers removed. They are formatted as code automatically.
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched the existing issues and this is not a duplicate.
          required: true
        - label: I removed all secrets, real identifiers, and customer data from this report.
          required: true
        - label: I agree to follow the Code of Conduct.
          required: true
